<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankit Website</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #100020, #6200aa, #05000d);
}
.card {
  padding: 30px;
  margin: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.12);
  box-shadow: 0 0 25px #a855f7;
}
h1 { font-size: 36px; }
button {
  padding: 14px 24px;
  border: none;
  border-radius: 30px;
  background: #d8b4fe;
  color: #20003d;
  font-size: 17px;
}
</style>
</head>
<body>
<div class="card">
  <h1>Welcome! ✨</h1>
  <p>Welcome to my website.</p>
  <button onclick="speak()">Click Me 🔊</button>
</div>
<script>
function speak() {
  const message = new SpeechSynthesisUtterance("Hello Hello!");
  message.lang = "en-US";
  speechSynthesis.speak(message);
}
</script>
</body>
</html>
